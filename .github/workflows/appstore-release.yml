# Publishes a release to the Nextcloud app store.
# Push a tag like v0.0.1-alpha1 that points at a commit on main. The tag must match <version> in
# appinfo/info.xml and the package.json version, and CHANGELOG.md needs a section for that version.
# Run it by hand (workflow_dispatch) to build and check the tarball without publishing anything.
# See RELEASING.md.

name: App store release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: appstore-release
  cancel-in-progress: false

env:
  APP_ID: orostelco

jobs:
  verify:
    name: Verify version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag, info.xml, package.json and CHANGELOG agree
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' appinfo/info.xml | head -n 1)
          pkg_version=$(node -p "require('./package.json').version")
          [ -n "$version" ] || { echo "::error::No <version> in appinfo/info.xml"; exit 1; }
          [ "$version" = "$pkg_version" ] || { echo "::error::info.xml ($version) and package.json ($pkg_version) differ"; exit 1; }
          if [ "$EVENT_NAME" = "push" ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "::error::Tag $REF_NAME does not match info.xml version v$version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $REF_NAME is not on main"; exit 1; }
          fi
          grep -Eq "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build app store tarball
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the tarball
        run: make appstore

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > build/release-notes.md
          test -s build/release-notes.md || { echo "::error::Release notes are empty"; exit 1; }
          cat build/release-notes.md

      - name: Check the tarball content
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tarball="build/appstore/${APP_ID}-${VERSION}.tar.gz"
          tar -tzf "$tarball" > build/files.txt
          grep -qx "${APP_ID}/appinfo/info.xml" build/files.txt
          grep -q "^${APP_ID}/js/" build/files.txt
          ! grep -Eq "^[^/]+/(src|tests|node_modules|vendor-bin|\.github)/|\.map$" build/files.txt || { echo "::error::Unwanted files in the tarball"; exit 1; }
          [ "$(cut -d/ -f1 build/files.txt | sort -u)" = "$APP_ID" ] || { echo "::error::Top level folder must be $APP_ID"; exit 1; }
          ls -l "$tarball"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appstore-tarball
          path: |
            build/appstore/*.tar.gz
            build/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to GitHub and the app store
    # Manual runs only build and check the tarball.
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: appstore
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: appstore-tarball

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tarball="appstore/${APP_ID}-${VERSION}.tar.gz"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$tarball" --clobber
          else
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            gh release create "$TAG" "$tarball" --verify-tag --title "Orostelco $VERSION" --notes-file release-notes.md $flags
          fi

      - name: Publish to the Nextcloud app store
        uses: nextcloud-releases/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1 # v1.0.3
        with:
          app_name: ${{ env.APP_ID }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.APP_ID }}-${{ needs.verify.outputs.version }}.tar.gz
          nightly: false
